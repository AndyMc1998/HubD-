# Builds Boxedwine (Windows-in-the-browser) for the web, adds the HubD
# launcher and touch controls, and publishes the result to GitHub Pages.
#
# No game files are involved: you pick your own Diablo II zip on your phone
# and it never leaves the device.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wine_url:
        description: Wine filesystem zip to bundle (Boxedwine TinyCore build)
        required: false
        default: ""
      wine_sha256:
        description: SHA-256 of that zip (leave empty to skip the check)
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned so a change upstream can't silently break the site.
  BOXEDWINE_REPO: https://github.com/danoon2/Boxedwine.git
  BOXEDWINE_COMMIT: c97af708a5393316a1eda291cd3013472babc5ff
  EMSDK_VERSION: 5.0.7
  # Boxedwine moves these between folders, so the build also asks its file list.
  WINE_FILE: TinyCore15Wine11.0.zip
  WINE_FOLDERS: "23 11"
  WINE_FILE_LIST: http://www.boxedwine.org/v2/26R2/filesV2.xml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        # jit: single threaded, works everywhere.
        # multiThreadedJit: uses Web Workers; needs the service worker's
        # cross-origin isolation headers.
        target: [jit, multiThreadedJit]
    steps:
      - name: Check out Boxedwine
        run: |
          git init boxedwine
          cd boxedwine
          git remote add origin "$BOXEDWINE_REPO"
          git fetch --depth 1 origin "$BOXEDWINE_COMMIT"
          git checkout FETCH_HEAD

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        run: |
          if [ ! -f emsdk/emsdk_env.sh ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build ${{ matrix.target }}
        run: |
          source emsdk/emsdk_env.sh
          cd boxedwine/project/emscripten
          make ${{ matrix.target }} -j"$(nproc)"

      # The build folder also holds object files; keep only what the browser loads.
      - name: Collect output
        env:
          BUILD_DIR: boxedwine/project/emscripten/Build/${{ matrix.target == 'jit' && 'Jit' || 'MultiThreadedJit' }}
        run: |
          mkdir out
          find "$BUILD_DIR" -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.wasm' -o -name '*.css' -o -name '*.data' \) -exec cp {} out/ \;
          ls -la out
          test -f out/boxedwine.html

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-${{ matrix.target }}
          path: out
          if-no-files-found: error

  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: boxedwine-jit
          path: dist/st

      - uses: actions/download-artifact@v4
        with:
          name: boxedwine-multiThreadedJit
          path: dist/mt

      - name: Download Wine filesystem
        env:
          WINE_URL: ${{ inputs.wine_url }}
          WINE_SHA256: ${{ inputs.wine_sha256 }}
        run: |
          if [ -n "$WINE_URL" ]; then
            candidates="$WINE_URL"
          else
            candidates=""
            for folder in $WINE_FOLDERS; do
              candidates="$candidates https://boxedwine.org/v2/$folder/$WINE_FILE"
            done
            # Whatever Boxedwine's own file list currently points at, newest Wine first.
            if curl -fsSL --retry 2 -o files.xml "$WINE_FILE_LIST"; then
              listed=$(grep -oE 'https?://[^"<> ]*TinyCore[^"<> ]*Wine[0-9.]+\.zip' files.xml | sort -u -t/ -k6 -V -r || true)
              echo "Wine filesystems in the file list:"; echo "$listed"
              candidates="$candidates $(echo "$listed" | grep -F "/$WINE_FILE" || true) $listed"
            else
              echo "Could not read $WINE_FILE_LIST"
            fi
          fi
          for url in $candidates; do
            echo "Trying $url"
            if curl -fL --retry 3 -o wine.zip "$url"; then
              echo "Downloaded $url"
              break
            fi
            rm -f wine.zip
          done
          if [ ! -s wine.zip ]; then
            echo "::error::No Wine filesystem could be downloaded. Run the workflow by hand with a wine_url."
            exit 1
          fi
          unzip -tq wine.zip
          sha256sum wine.zip
          if [ -n "$WINE_SHA256" ]; then
            echo "$WINE_SHA256  wine.zip" | sha256sum -c -
          fi

      - name: Assemble site
        run: scripts/assemble-site.sh dist/st dist/mt wine.zip site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
